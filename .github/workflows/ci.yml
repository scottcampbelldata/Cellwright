# SPDX-License-Identifier: EUPL-1.2
name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_site.mjs
      - run: cargo build --locked --release
      - if: runner.os == 'Windows'
        run: python scripts/package.py --binary target/release/cellwright.exe --platform windows-x86_64 --out dist
      - if: runner.os == 'Linux'
        run: python scripts/package.py --binary target/release/cellwright --platform linux-x86_64 --out dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cellwright-${{ matrix.os }}
          path: dist/*
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz run parsers corpus -- -max_total_time=30 -max_len=262144 -rss_limit_mb=1024 -timeout=5
