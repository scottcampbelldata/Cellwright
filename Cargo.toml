[package]
name = "cellwright"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "EUPL-1.2"
description = "Offline inventory and migration assessment of Excel VBA workbooks"
repository = "https://github.com/scottcampbelldata/Cellwright"
homepage = "https://cellwright.scottcampbell.io"
readme = "README.md"
keywords = ["excel", "vba", "libreoffice", "migration", "xlsm"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
anyhow = "1"
base64 = "0.23"
codepage = "0.1.3"
cfb = "0.15"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
encoding_rs = "0.8"
quick-xml = "0.41"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
calamine = "0.36.1"

[profile.release]
lto = "thin"
strip = true
